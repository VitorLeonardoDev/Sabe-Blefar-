<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sabe Blefar? – TV</title>
<link rel="stylesheet" href="/style.css">
<style>
body{background:#0f172a;margin:0}
.tv{min-height:100vh;border:0;border-radius:0;padding:4vh 4vw;font-size:1.3vw}
.tv.tu{padding-bottom:20vh}
.tv .pl{min-width:9vw}.tv .pl b{font-size:2.4vw}.tv .ref strong{font-size:9vw}.tv .st{font-size:1.8vw}.tv .cl{font-size:1.8vw}.tv .log{font-size:1.3vw}
.tv .cap{font-size:1.6vw;padding:1.2vw 1.6vw}
.lob h1{font-size:4vw;margin:0}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:3vw;margin-top:4vh;text-align:center}
.card{background:var(--pn);border:2px solid var(--bd);border-radius:18px;padding:2.2vw;min-height:55vh}
.card h3{margin:0 0 1.4vw;font-size:2vw}
.card .code{font-size:5.5vw;line-height:1.1}
#qr{display:block;box-sizing:content-box;background:#fff;padding:1vw;border-radius:12px;margin:1.4vw auto}
#qr canvas{display:none!important}#qr img{display:block;width:100%;height:100%}
.card .how{margin-top:1.4vw}
.pr{display:flex;justify-content:space-between;align-items:center;background:#0f172a66;border:1px solid var(--bd);border-radius:10px;padding:.7vw 1.2vw;margin-bottom:.7vw;font-size:1.8vw}
.pr small{color:var(--ac)}
/* tela única dos poderes */
.pwo{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vw;background:radial-gradient(circle,#5b21b6f2,#0b0620f7);overflow:hidden;animation:pwin .4s ease-out;text-align:center}
.pwo::before{content:'';position:absolute;inset:-60%;background:repeating-conic-gradient(#fbbf2426 0 10deg,transparent 10deg 20deg);animation:pwspin 8s linear infinite}
.pwo>*{position:relative}
.pwo .ic{font-size:13vw;line-height:1;animation:pwpop .7s cubic-bezier(.2,1.6,.4,1)}
.pwo h2{margin:0;font-size:4.2vw;color:#fbbf24;letter-spacing:.25em;text-shadow:0 0 2vw #fbbf24}
.pwo .who{font-size:3vw;font-weight:800}.pwo .det{font-size:2vw;color:#e9d5ff}
@keyframes pwspin{to{transform:rotate(360deg)}}@keyframes pwpop{from{transform:scale(0) rotate(-120deg)}}@keyframes pwin{from{opacity:0}}
@media(prefers-reduced-motion:reduce){.pwo::before,.pwo .ic{animation:none}}
</style>
</head>
<body>
<section class="tv" id="tv"></section>
<button id="snd" type="button">🔊 Toque para ativar o som</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/common.js"></script>
<script src="/audio.js"></script>
<script>
let S = null, toastN = 0, toastUntil = 0, pwN = 0, pwUntil = 0;
async function init() {
  let c = sessionStorage.sbroom; // F5 na TV mantém a mesma sala
  if (c) { const r = await fetch('/api/room/' + c).catch(() => null); if (!r || !r.ok) c = null; }
  if (!c) { c = (await (await fetch('/api/room', { method: 'POST' })).json()).code; sessionStorage.sbroom = c; }
  listen('/api/tv/' + c, s => { S = s; sound(s); draw(); }, () => {});
}
function draw() {
  const T = $('tv');
  if (!S) { T.className = 'tv'; T.dataset.m = ''; T.innerHTML = '<div class="lob"><h1>Conectando…</h1></div>'; return; }
  if (S.phase == 'lobby') {
    if (T.dataset.m != 'lobby') { // monta o lobby uma única vez: o QR code não é refeito quando alguém entra
      T.dataset.m = 'lobby'; T.className = 'tv';
      T.innerHTML = `<div class="lob" style="text-align:center"><h1>🃏 Sabe Blefar?</h1>
      <div class="lg">
        <div class="card"><h3>Entre pelo celular</h3><div class="mu">Escaneie com a câmera</div><div id="qr"></div>
        <div class="mu how">ou acesse <b>${location.host}</b> e digite o código</div><div class="code">${S.code}</div></div>
        <div class="card"><h3>Na sala</h3><div id="plist"></div><p id="hint" class="mu"></p></div>
      </div></div>`;
      if (window.QRCode) { const Q = Math.round(innerWidth * .14), e = $('qr'); e.style.width = Q + 'px'; e.style.height = Q + 'px'; new QRCode(e, { text: location.origin + '/' + S.code, width: Q, height: Q }); }
    }
    $('plist').innerHTML = S.ps.map((p, i) => `<div class="pr"><span>${p.n}</span><small>${i ? (p.conn ? 'conectado' : 'desconectado') : 'host'}</small></div>`).join('');
    $('hint').textContent = S.ps.length ? 'O host inicia a partida pelo celular.' : 'Aguardando jogadores…';
    return;
  }
  T.dataset.m = 'g';
  if (S.phase == 'tutorial') {
    const s = TS[Math.max(0, S.tut)]; T.className = 'tv tu';
    T.innerHTML = gameHTML(fakeState(s)) + `<div class="cap"><b>Tutorial ${S.tut + 1}/${TS.length} · ${s.t}</b><div>${s.c}</div></div>`;
    return;
  }
  T.className = 'tv'; T.innerHTML = gameHTML(S);
}
function gameHTML(S) {
  const ph = S.phase, q = S.pend, A = S.ps[S.actor], busy = ph != 'over' && ph != 'reveal';
  const tag = i => i != S.actor || !busy ? '' : ph == 'window' ? '<em>pode acusar</em>' : ph == 'turn' ? '<em>vez · acusar?</em>' : ph == 'play' ? '<em>jogando</em>' : '';
  const pls = S.ps.map((p, i) => `<div class="pl ${p.alive ? '' : 'dead'} ${i == S.actor && busy ? 'on' : ''}"><span>${p.n}</span><b>${p.pts}</b><small>${!p.alive ? (p.gone ? 'removido' : 'fora') : !p.conn ? 'desconectado' : p.cards + ' cartas'}</small>${p.alive && p.pw ? `<small>🔮 ${p.pw}</small>` : ''}${S.pend && S.pend.gag === i ? '<small>🔒 mordaça</small>' : ''}${tag(i)}</div>`).join('');
  const st = ph == 'window' ? `${A.n} pode acusar agora` : ph == 'turn' ? `Vez de ${A.n}: ${S.forced ? 'acusação obrigatória!' : 'acusar ou jogar'}` : ph == 'play' ? `${A.n} está escolhendo a carta` : '';
  let ov = '';
  if (ph == 'challenge' && S.ch) return `<div class="pls">${pls}</div>${chalHTML(S)}`;
  if (S.rev) { const r = S.rev, a = S.ps[r.by], b = S.ps[r.p];
    ov = `<div class="ov">${face(r.card).replace('class="c ', 'class="c big ')}<h2 class="${r.ok ? 'bad' : 'ok'}">${r.ok ? 'MENTIRA!' : 'VERDADE!'}</h2><div>${a.n} acusou ${b.n} · ${ctext(r)}</div><div class="mu">${r.ok ? `${a.n} +2 · ${b.n} −${r.dbl ? 4 : 2}` : `${a.n} −1`}</div>${r.gold ? '<div class="mu">🃏 Carta dourada! Contou como verdade</div>' : ''}${r.dbl && r.ok ? '<div class="mu">🎲 Aposta dobrada!</div>' : ''}</div>`; }
  if (ph == 'over') { const w = S.ps[S.win]; ov = `<div class="ov"><h2 class="ok">🏆 ${w ? w.n : 'Sem vencedor'}</h2><div>venceu a partida!</div><div class="mu">O host pode jogar de novo pelo celular.</div></div>`; }
  let pwo = '';
  if (!S.fake && S.pw) { // poder usado: tela especial por ~4s
    if (S.pw.n != pwN) { pwN = S.pw.n; pwUntil = Date.now() + 4000; setTimeout(draw, 4100); }
    if (Date.now() < pwUntil) pwo = pwHTML(S);
  }
  let toast = '';
  if (S.fake) { if (S.nud) toast = `<div class="toast">👋 ${S.ps[S.nud.f].n} avisou ${S.ps[S.nud.t].n}!</div>`; }
  else {
    if (S.nud && S.nud.n != toastN) { toastN = S.nud.n; toastUntil = Date.now() + 5000; setTimeout(draw, 5100); }
    if (S.nud && Date.now() < toastUntil) toast = `<div class="toast">👋 ${S.ps[S.nud.f].n} avisou ${S.ps[S.nud.t].n}!</div>`;
  }
  return `<div class="pls">${pls}</div>
  <div class="mid"><div class="ref"><small>REFERÊNCIA</small><strong>${S.ref}</strong><em>${RK[S.ref]}</em></div>
  <div class="pile"><div class="c back"></div><div>${q ? `<b>${S.ps[q.p].n}</b> jogou e disse<div class="cl">${ctext(q)}</div>` : '<span class="mu">Mesa vazia</span>'}</div></div></div>
  <div class="st">${st}</div><div class="tm"><i id="bar"></i></div>
  <div class="log">${S.log.map(l => `<div>${l}</div>`).join('')}</div>${ov}${toast}${pwo}`;
}
function pwHTML(S) {
  const e = S.pw, by = S.ps[e.by], P = e.k && PW[e.k];
  const det = !e.k ? 'Ninguém sabe qual foi… 🤫' : e.k == 'gag' ? `${S.ps[e.to].n} não poderá acusar a próxima jogada`
    : e.k == 'radar' ? (e.res ? '🚨 A última jogada foi BLEFE! (−1 ponto)' : '✅ A última jogada era VERDADE (−1 ponto)')
    : e.k == 'free' ? 'Acusação obrigatória dispensada' : `Nova referência: ${S.ref}`;
  return `<div class="pwo"><div class="ic">${P ? P.i : '❓'}</div><h2>PODER!</h2><div class="who">${by.n} usou ${P ? P.n : 'um poder secreto'}</div><div class="det">${det}</div></div>`;
}
function chalHTML(S) {
  const c = S.ch, A = S.ps[c.by], B = S.ps[c.tg], done = c.step == 'done';
  const sub = c.step == 'pick' ? `${B.n} está escondendo ${c.size} cartas de 1 a ${c.pool}…`
    : c.step == 'guess' ? `${A.n} precisa acertar ${c.need} das ${c.size} cartas de ${B.n} (${c.tries} palpites)`
    : c.ok ? `${A.n} acertou ${c.need} cartas!` : `${A.n} não acertou ${c.need} cartas`;
  let cells = '';
  for (let n = 1; n <= c.pool; n++) {
    const g = c.guesses.find(x => x.n == n), inDeck = done && c.deck.includes(n);
    cells += `<div class="n ${g ? (g.hit ? 'hit' : 'miss') : ''} ${inDeck && !(g && g.hit) ? 'rev' : ''}">${n}</div>`;
  }
  const used = c.guesses.length;
  const res = done ? `<div class="res ${c.ok ? 'ok' : 'bad'}">${c.ok ? `${A.n} +${c.pts} · ${B.n} −${c.pts}` : `${A.n} −${c.pts} · ${B.n} +${c.pts}`}</div>` : '';
  return `<div class="chal"><h2>⚔️ DESAFIO: ${A.n} contra ${B.n}</h2><div class="sub">${sub}</div>
  <div class="dk">${cells}</div>${c.step == 'guess' ? `<div class="tally">Acertos: ${c.hits}/${c.need} · Palpites: ${used}/${c.tries}</div>` : ''}${res}</div>
  <div class="tm"><i id="bar"></i></div><div class="log">${S.log.map(l => `<div>${l}</div>`).join('')}</div>`;
}

// ---- Áudio da TV (reage às mudanças de estado vindas do servidor) ----
let PV = null, tkSec = 0, mutedTV = false, unlockedAt = 0;
const snd = $('snd');
const sndLabel = () => { snd.textContent = !SB.on ? '🔊 Toque para ativar o som' : mutedTV ? '🔇 Som desligado' : '🔊 Som ligado'; };
const firstTouch = () => { if (!SB.on) { SB.unlock(); unlockedAt = Date.now(); sndLabel(); } };
addEventListener('pointerdown', firstTouch); addEventListener('keydown', firstTouch);
snd.onclick = () => { if (Date.now() - unlockedAt < 500) return; mutedTV = SB.toggleMute(); sndLabel(); };
function sound(s) {
  const pv = PV, ph = s.phase; PV = s;
  if (!pv) pwN = s.pw ? s.pw.n : 0; // não repete um poder antigo ao recarregar a TV
  SB.music(ph == 'challenge' ? 'challenge' : (ph == 'lobby' || ph == 'tutorial') ? 'lobby' : ph == 'over' ? null : 'game');
  if (!pv) return;
  if (s.pw && (!pv.pw || s.pw.n != pv.pw.n)) SB.sfx('power'); // poder usado
  const inGame = ['play', 'window', 'turn'].includes(ph);
  if (inGame && (s.actor != pv.actor || pv.phase == 'lobby' || pv.phase == 'tutorial')) SB.sfx('whoosh'); // trocou a pessoa da vez
  if (ph == 'reveal' && pv.phase != 'reveal' && s.rev) SB.sfx(s.rev.ok ? 'boom' : 'flash');             // acusou: acertou = boom, errou = flash
  if (ph == 'challenge' && s.ch) {
    if (pv.phase != 'challenge') SB.sfx('whoosh');
    else if (pv.ch && s.ch.guesses.length > pv.ch.guesses.length) SB.sfx(s.ch.guesses[s.ch.guesses.length - 1].hit ? 'boom' : 'flash');
  }
  if (ph == 'over' && pv.phase != 'over') SB.sfx('win');
}
function tickCheck() { // relógio nos últimos 5s da vez de uma pessoa (bots não contam)
  if (!S || !S.left) { tkSec = 0; return; }
  let who = -1;
  if (['play', 'window', 'turn'].includes(S.phase)) who = S.actor;
  else if (S.phase == 'challenge' && S.ch) who = S.ch.step == 'pick' ? S.ch.tg : S.ch.step == 'guess' ? S.ch.by : -1;
  const P = S.ps[who]; if (!P || P.bot) { tkSec = 0; return; }
  const sec = Math.ceil((S.end - Date.now()) / 1000);
  if (sec >= 1 && sec <= 5) { if (sec != tkSec) { tkSec = sec; SB.sfx('tick', sec & 1); } } else tkSec = 0;
}
setInterval(() => { const b = $('bar'); if (b && S) b.style.width = S.left ? Math.max(0, (S.end - Date.now()) / 300) + '%' : '0'; tickCheck(); }, 200);
init();
</script>
</body>
</html>
